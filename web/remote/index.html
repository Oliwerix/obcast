<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OBCast — Shows</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #14161a; color: #e6e6e6; margin: 0; padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #8a8f98; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #1c1f24; border: 1px solid #2a2e35; border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  button {
    background: #2a2e35; color: #e6e6e6; border: 1px solid #383d46; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #383d46; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.danger { background: #3a1e1e; border-color: #5a2a2a; color: #f87171; }
  button.danger:hover { background: #4a2525; }
  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 100px; font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .pill.live, .pill.up, .pill.playing { background: #1e4530; color: #4ade80; }
  .pill.past, .pill.stopped { background: #2a2e35; color: #8a8f98; }
  .pill.down, .pill.error { background: #3a1e1e; color: #f87171; }
  .pill.stalled, .pill.paused, .pill.buffering { background: #4a3a12; color: #facc15; }
  .health { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .table-scroll { width: 100%; overflow-x: auto; }
  table.shows { width: 100%; border-collapse: collapse; min-width: 640px; }
  table.shows th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: #8a8f98; font-weight: 600; padding: 8px 12px 8px 0; border-bottom: 1px solid #2a2e35;
  }
  table.shows td { padding: 12px 12px 12px 0; font-size: 13px; color: #b8bcc4; border-bottom: 1px solid #23262c; vertical-align: middle; }
  table.shows tr:last-child td { border-bottom: none; }
  table.shows td.v { color: #e6e6e6; font-variant-numeric: tabular-nums; }
  a.show-name { color: #e6e6e6; font-weight: 600; text-decoration: none; font-size: 14px; }
  a.show-name:hover { color: #4a7de0; text-decoration: underline; }
  .muted { color: #8a8f98; font-size: 13px; }
  .empty { color: #8a8f98; font-size: 14px; padding: 24px 4px; text-align: center; }
  #banner { font-size: 13px; margin-bottom: 12px; display: none; }
  #banner.err { display: block; background: #3a1e1e; color: #f87171; border: 1px solid #5a2a2a; border-radius: 6px; padding: 8px 12px; }
  #banner.ok  { display: block; background: #1e4530; color: #4ade80; border: 1px solid #2a5a3f; border-radius: 6px; padding: 8px 12px; }

  /* Larger touch targets on a narrow (phone/tablet) viewport -- checking on
     a show from a phone in the field is an explicit use case here. */
  @media (max-width: 640px) {
    body { padding: 14px; }
    button { min-height: 44px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<h1>OBCast — Shows</h1>
<div class="sub">Every stream the server has received audio for. Open one to control it, or delete a past show to reclaim disk.</div>

<div id="banner" role="status" aria-live="polite"></div>

<div class="card">
  <div id="content">
    <div class="empty">Loading shows…</div>
  </div>
</div>

<script>
const apiBase = '';

// --- formatting helpers ---
function humanBytes(bytes) {
  if (bytes == null) return '—';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function humanDuration(ms) {
  if (ms == null) return '—';
  const totalSecs = Math.round(ms / 1000);
  const h = Math.floor(totalSecs / 3600);
  const m = Math.floor((totalSecs % 3600) / 60);
  const s = totalSecs % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function relativeTime(unixMs) {
  if (unixMs == null) return '—';
  const diff = Date.now() - unixMs;
  if (diff < 0) return 'just now';
  const secs = Math.round(diff / 1000);
  if (secs < 10) return 'just now';
  if (secs < 60) return `${secs} seconds ago`;
  const mins = Math.round(secs / 60);
  if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
  // older than a day: show an absolute local timestamp
  return new Date(unixMs).toLocaleString();
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// --- state ---
let latestShows = [];
let deleting = new Set(); // names with an in-flight delete
const banner = document.getElementById('banner');
const content = document.getElementById('content');

function showBanner(kind, text) {
  banner.className = kind;
  banner.textContent = text;
  if (kind === 'ok') {
    setTimeout(() => {
      if (banner.textContent === text) { banner.className = ''; banner.textContent = ''; }
    }, 4000);
  }
}

function render() {
  if (latestShows.length === 0) {
    content.innerHTML = '<div class="empty">No shows yet.</div>';
    return;
  }

  const rows = latestShows.map(show => {
    const name = show.name;
    const enc = escapeHtml(name);
    // Absolute path: a bare "/remote" request (no trailing slash) is served
    // index.html directly with no redirect, so a relative href here would
    // resolve against "/" instead of "/remote/" and 404.
    const href = '/remote/stream.html?stream=' + encodeURIComponent(name);
    const pill = show.live
      ? '<span class="pill live">live</span>'
      : '<span class="pill past">past</span>';
    const isDeleting = deleting.has(name);
    const delLabel = isDeleting ? 'Deleting…' : 'Delete';
    const delAttr = isDeleting ? 'disabled' : '';
    return `
      <tr data-name="${enc}">
        <td><a class="show-name" href="${escapeHtml(href)}">${enc}</a></td>
        <td>${pill}</td>
        <td class="v health" data-health="${enc}">${healthPillsHtml(name)}</td>
        <td class="v">${humanBytes(show.size_bytes)}</td>
        <td class="v">${humanDuration(show.duration_ms)}</td>
        <td class="v">${show.segment_count ?? 0}</td>
        <td class="muted">${escapeHtml(relativeTime(show.modified_unix_ms))}</td>
        <td><button class="danger" data-del="${enc}" ${delAttr} aria-label="Delete show ${enc}">${delLabel}</button></td>
      </tr>`;
  }).join('');

  content.innerHTML = `
    <div class="table-scroll">
    <table class="shows">
      <thead>
        <tr>
          <th scope="col">Show</th><th scope="col">Status</th><th scope="col">Health</th>
          <th scope="col">Size</th><th scope="col">Duration</th>
          <th scope="col">Segments</th><th scope="col">Last active</th><th scope="col"></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>`;

  content.querySelectorAll('button[data-del]').forEach(btn => {
    btn.onclick = () => onDelete(btn.getAttribute('data-del'));
  });
}

// --- Multi-stream health (link/playout state per live show) ---
//
// A single overview of everything the server has received audio for was
// already here, but none of the columns reflected live *health* -- an
// operator running several simultaneous OB feeds had to open each show's
// own stream.html individually just to see whether it was actually healthy
// right now. Fetched via the existing GET /api/{stream}/status REST route
// (not a WebSocket per row -- N long-lived sockets from an overview page
// that's often left open for a whole broadcast day is exactly the kind of
// resource-lifecycle cost this session's perf/leak pass was about avoiding),
// and only for currently-live shows, so the extra request count scales with
// concurrent broadcasts, not with total show history.
let healthCache = {}; // name -> {connected, playoutState} | null (fetch failed)

async function fetchHealth(name) {
  try {
    const resp = await fetch(apiBase + '/api/' + encodeURIComponent(name) + '/status');
    if (!resp.ok) return null;
    const data = await resp.json();
    return { connected: !!(data.link && data.link.connected), playoutState: data.server?.playout?.state ?? null };
  } catch {
    return null;
  }
}

function healthPillsHtml(name) {
  const h = healthCache[name];
  if (h === undefined) return '';
  if (h === null) return '<span class="pill past">—</span>';
  const linkHtml = `<span class="pill ${h.connected ? 'up' : 'down'}">${h.connected ? 'link up' : 'link down'}</span>`;
  const stateHtml = h.playoutState
    ? `<span class="pill ${h.playoutState}">${escapeHtml(h.playoutState)}</span>`
    : '';
  return linkHtml + stateHtml;
}

async function refreshHealth() {
  const liveNames = latestShows.filter(s => s.live).map(s => s.name);
  if (liveNames.length === 0) { healthCache = {}; return; }
  const results = await Promise.all(liveNames.map(async name => [name, await fetchHealth(name)]));
  const next = {};
  results.forEach(([name, health]) => { next[name] = health; });
  healthCache = next;

  // Patch the health cells directly rather than a full render() -- health
  // can change every poll for a live show even when sameShows() above
  // decides nothing else did, and this shouldn't force a full table rebuild
  // (rebinding every delete listener, wiping selection) just to update a
  // couple of pills.
  content.querySelectorAll('td[data-health]').forEach(cell => {
    const name = cell.getAttribute('data-health');
    cell.innerHTML = healthPillsHtml(name);
  });
}

// Whether two shows lists are equal in every field render() displays.
// Compared field-by-field (rather than JSON.stringify) so field reordering
// in a future server response doesn't spuriously trigger a rebuild.
function sameShows(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    const x = a[i], y = b[i];
    if (x.name !== y.name || x.live !== y.live || x.size_bytes !== y.size_bytes ||
        x.duration_ms !== y.duration_ms || x.segment_count !== y.segment_count ||
        x.modified_unix_ms !== y.modified_unix_ms) {
      return false;
    }
  }
  return true;
}

// Patches just the "Last active" cell text in place, without touching any
// other DOM (and in particular without rebinding delete-button listeners or
// disturbing a user's text selection) — used when the underlying data hasn't
// changed but wall-clock time has moved on since the last full render(),
// so the relative-time column doesn't go stale between real changes.
function refreshRelativeTimes() {
  content.querySelectorAll('tr[data-name]').forEach(row => {
    const show = latestShows.find(s => s.name === row.getAttribute('data-name'));
    const cell = row.querySelector('td.muted');
    if (show && cell) cell.textContent = relativeTime(show.modified_unix_ms);
  });
}

async function onDelete(name) {
  if (deleting.has(name)) return;
  if (!confirm(`Delete show "${name}"?\n\nThis permanently removes all audio files the server received for it. This cannot be undone.`)) {
    return;
  }
  deleting.add(name);
  render();
  try {
    const resp = await fetch(apiBase + '/api/shows/' + encodeURIComponent(name), { method: 'DELETE' });
    if (resp.status === 204) {
      latestShows = latestShows.filter(s => s.name !== name);
      showBanner('ok', `Deleted "${name}".`);
    } else if (resp.status === 404) {
      latestShows = latestShows.filter(s => s.name !== name);
      showBanner('err', `"${name}" no longer exists — it may have already been deleted.`);
    } else {
      showBanner('err', `Failed to delete "${name}" (server returned ${resp.status}).`);
    }
  } catch (e) {
    showBanner('err', `Failed to delete "${name}": ${e.message || 'network error'}.`);
  } finally {
    deleting.delete(name);
    render();
  }
}

async function refresh() {
  try {
    const resp = await fetch(apiBase + '/api/shows');
    if (!resp.ok) {
      if (banner.className !== 'err') showBanner('err', `Could not load shows (server returned ${resp.status}).`);
      return;
    }
    const data = await resp.json();
    if (!Array.isArray(data)) {
      showBanner('err', 'Could not load shows: unexpected response from server.');
      return;
    }
    if (banner.className === 'err') { banner.className = ''; banner.textContent = ''; }

    // Skip the full table rebuild (which recreates every row's DOM node and
    // rebinds every delete button's onclick, wiping any in-progress text
    // selection) on a poll where nothing actually changed -- true for most
    // polls, since a show's stats only move while it's actively receiving
    // audio. Still patch the "Last active" text directly so it doesn't go
    // stale between real changes.
    if (sameShows(data, latestShows)) {
      latestShows = data;
      refreshRelativeTimes();
      return;
    }
    latestShows = data;
    render();
  } catch (e) {
    // Keep whatever is on screen; surface the problem without wiping the list.
    if (latestShows.length === 0) {
      content.innerHTML = '<div class="empty">Could not reach the server. Retrying…</div>';
    }
    showBanner('err', `Could not load shows: ${e.message || 'network error'}.`);
  }
}

// Paused entirely while the tab is hidden -- this used to poll at a fixed
// 7s cadence forever regardless of whether the tab was focused, backgrounded,
// or left open in another window for a whole broadcast day. Refreshes
// immediately on becoming visible again instead of waiting out the interval.
const REFRESH_MS = 7000;
let refreshTimer = null;
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  if (document.hidden) return;
  refreshTimer = setTimeout(() => { refresh().then(refreshHealth).finally(scheduleRefresh); }, REFRESH_MS);
}
refresh().then(refreshHealth).finally(scheduleRefresh);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refresh().then(refreshHealth).finally(scheduleRefresh);
});
</script>

</body>
</html>
